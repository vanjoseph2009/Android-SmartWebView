name: Build Smart WebView v8 APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código Nativo
      uses: actions/checkout@v4

    - name: Configurar ambiente Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Android SDK ferramentas de compilação
      uses: android-actions/setup-android@v3

    - name: Dar permissão de execução para o Gradle
      run: chmod +x gradlew

    - name: Compilar APK Nativo (Modo Debug com AdMob)
      run: ./gradlew assembleDebug

    - name: Disponibilizar APK do Lorenzo para Download
      uses: actions/upload-artifact@v4
      with:
        name: Lorenzo-SmartWebView-APK
        path: app/build/outputs/apk/debug/app-debug.apk
