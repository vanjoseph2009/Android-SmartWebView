name: Build Smart WebView v8 AAB Autossinado

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código Nativo
      uses: actions/checkout@v4.2.2

    - name: Configurar ambiente Java JDK 17
      uses: actions/setup-java@v4.5.0
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Android SDK e Aceitar Licenças
      uses: android-actions/setup-android@v3.2.1

    - name: Garantir Permissões do Compilador
      run: |
        chmod +x gradlew
        mkdir -p "$ANDROID_HOME/licenses" || true
        echo "24a335a4f57f80877430e4ae15220d914f646721" > "$ANDROID_HOME/licenses/android-sdk-license" || true

    - name: Correção de Arquitetura de Namespace e Recursos Duplicados
      run: |
        sed -i 's/package="mgks.os.swv"//g' app/src/main/AndroidManifest.xml
        rm -f app/src/main/res/values/ads.xml || true
        sed -i 's/namespace .*/namespace "mgks.os.swv"/g' app/build.gradle
        sed -i 's/applicationId .*/applicationId "com.lorenzo.aventureiro"/g' app/build.gradle

    - name: Compilar AAB Nativo para Play Store
      run: ./gradlew clean bundleRelease

    - name: Assinar o Arquivo AAB Automaticamente
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/bundle/release
        signingKeyBase64: ""
        alias: "vjgames"
        keyStorePassword: "vjgamespassword"
        keyPassword: "vjgamespassword"

    - name: Disponibilizar AAB Assinado para Download
      uses: actions/upload-artifact@v4.4.3
      with:
        name: Lorenzo-SmartWebView-AAB-Assinado
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
