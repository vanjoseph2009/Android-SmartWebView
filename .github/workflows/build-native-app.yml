name: Build Smart WebView v8 AAB Assinado VJGames

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código Nativo
      uses: actions/checkout@v4.2.2

    - name: Configurar ambiente Java JDK 17
      uses: actions/setup-java@v5.5.0
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Android SDK e Aceitar Licenças
      uses: android-actions/setup-android@v3.2.1

    - name: Configurar Gradle Estável no Executor
      # CORREÇÃO CRÍTICA: Força o GitHub a descarregar e utilizar a versão 8.4 do Gradle.
      # Esta versão é a ideal e compatível com o ecossistema de plug-ins do Smart WebView v8.
      uses: gradle/actions/setup-gradle@v4.1.0
      with:
        gradle-version: '8.4'

    - name: Correção de Arquitetura de Namespace, Pacotes e Mapeamento de Plugins
      run: |
        rm -f app/src/main/res/values/ads.xml || true

    - name: Restaurar Chave Keystore Definitiva
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > oficial.keystore

    - name: Compilar App Bundle Nativo usando Gradle 8.4
      # Comando ajustado para a sintaxe pura da versão estabilizada
      run: CI=false gradle clean :app:bundleRelease --no-daemon --no-configuration-cache -Dorg.gradle.console.interactive=false

    - name: Assinar AAB de Forma Fixa e Segura
      run: |
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore oficial.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" app/build/outputs/bundle/release/app-release.aab "${{ secrets.ANDROID_KEY_ALIAS }}"
        mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/Lorenzo_O_Aventureiro_Assinado.aab

    - name: Disponibilizar AAB do Lorenzo para Download
      uses: actions/upload-artifact@v4.4.3
      with:
        name: Lorenzo-VJGames-AAB-Final
        path: app/build/outputs/bundle/release/Lorenzo_O_Aventureiro_Assinado.aab
