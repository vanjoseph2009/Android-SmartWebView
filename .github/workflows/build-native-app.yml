name: Build Smart WebView v8 APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Força o ambiente global a rodar no Node 24 limpo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código Nativo
      uses: actions/checkout@v4

    - name: Configurar ambiente Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Android SDK e Aceitar Licenças
      uses: android-actions/setup-android@v3

    - name: Garantir Permissões do Compilador
      run: |
        chmod +x gradlew
        mkdir -p "$ANDROID_HOME/licenses" || true
        echo "24a335a4f57f80877430e4ae15220d914f646721" > "$ANDROID_HOME/licenses/android-sdk-license" || true

    - name: Compilar APK Nativo (Limpeza de Cache e Build)
      run: ./gradlew clean assembleDebug

    - name: Disponibilizar APK do Lorenzo para Download
      uses: actions/upload-artifact@v4
      with:
        name: Lorenzo-SmartWebView-APK
        path: app/build/outputs/apk/debug/app-debug.apk
