name: Build Smart WebView v8 AAB Assinado VJGames

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código Nativo
      uses: actions/checkout@v4.2.2

    - name: Configurar ambiente Java JDK 17
      uses: actions/setup-java@v5.5.0
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Android SDK e Aceitar Licenças
      uses: android-actions/setup-android@v3.2.1

    - name: Garantir Permissões do Compilador
      run: |
        chmod +x gradlew
        mkdir -p "$ANDROID_HOME/licenses" || true
        echo "24a335a4f57f80877430e4ae15220d914f646721" > "$ANDROID_HOME/licenses/android-sdk-license" || true

    - name: Correção de Arquitetura de Namespace, Pacotes e Mapeamento de Plugins
      run: |
        # 1. Limpa o manifesto de tags antigas para evitar conflitos de compilação
        if [ -f app/src/main/AndroidManifest.xml ]; then
          sed -i 's/package=".*"//g' app/src/main/AndroidManifest.xml || true
        fi

        # 2. Elimina o ficheiro ads.xml para evitar a duplicação de strings do AdMob com o seu strings.xml
        rm -f app/src/main/res/values/ads.xml || true

        # 3. CORREÇÃO DA SINTAXE DO GRADLE
        if [ -f app/build.gradle ]; then
          sed -i 's/namespace .*/namespace "com.vjgames.lorenzooaventureiro"/g' app/build.gradle || true
          sed -i 's/applicationId .*/applicationId "com.vjgames.lorenzooaventureiro"/g' app/build.gradle || true
        fi

        # 4. RESOLUÇÃO DE IMPORTS CRUZADOS E PACOTES DE PLUGINS
        find app/src/main/java/ -name "*.java" -exec sed -i 's/package mgks.os.swv.plugins;/package com.vjgames.lorenzooaventureiro.plugins;/g' {} + || true
        find app/src/main/java/ -name "*.java" -exec sed -i 's/package mgks.os.swv;/package com.vjgames.lorenzooaventureiro;/g' {} + || true
        find app/src/main/java/ -name "*.java" -exec sed -i 's/mgks.os.swv/com.vjgames.lorenzooaventureiro/g' {} + || true

        # 5. REESTRUTURAÇÃO FÍSICA DE DIRETÓRIOS EM TEMPO DE EXECUÇÃO
        mkdir -p app/src/main/java/com/vjgames/lorenzooaventureiro/plugins
        if [ -d app/src/main/java/mgks/os/swv ]; then
          cp -r app/src/main/java/mgks/os/swv/plugins/* app/src/main/java/com/vjgames/lorenzooaventureiro/plugins/ || true
          cp app/src/main/java/mgks/os/swv/*.java app/src/main/java/com/vjgames/lorenzooaventureiro/ || true
          rm -rf app/src/main/java/mgks || true
        fi

    - name: Compilar App Bundle Nativo (bundleRelease)
      run: ./gradlew clean bundleRelease --no-daemon

    - name: Gerar Keystore Temporária e Assinar o AAB Oficialmente
      run: |
        # 1. Cria uma chave de segurança digital válida em tempo de execução
        keytool -genkey -v -keystore temporaria.keystore -alias lorenzoalias -keyalg RSA -keysize 2048 -validity 10000 -storepass lorenzopass -keypass lorenzopass -dname "CN=VJ Games, OU=Development, O=VJ Games, L=Sao Paulo, S=SP, C=BR"
        
        # 2. Localiza as ferramentas de Build do Android SDK para usar o jarsigner (obrigatório para ficheiros .aab)
        # Nota: O formato AAB não utiliza o zipalign/apksigner diretamente como o APK; utiliza o jarsigner do JDK.
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore temporaria.keystore -storepass lorenzopass app/build/outputs/bundle/release/app-release.aab lorenzoalias

        # 3. Renomeia o arquivo para ficar organizado
        mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/Lorenzo_O_Aventureiro_Assinado.aab

    - name: Disponibilizar AAB Assinado para Download
      uses: actions/upload-artifact@v4.4.3
      with:
        name: Lorenzo-VJGames-AAB-Final
        path: app/build/outputs/bundle/release/Lorenzo_O_Aventureiro_Assinado.aab
