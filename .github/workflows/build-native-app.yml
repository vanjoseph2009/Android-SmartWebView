name: Build Smart WebView v8 APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código Nativo
      uses: actions/checkout@v4

    - name: Configurar ambiente Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Android SDK e Aceitar Licenças
      uses: android-actions/setup-android@v3

    - name: Garantir Permissões do Compilador
      run: |
        chmod +x gradlew
        mkdir -p "$ANDROID_HOME/licenses" || true
        echo "24a335a4f57f80877430e4ae15220d914f646721" > "$ANDROID_HOME/licenses/android-sdk-license" || true

    - name: Correção de Arquitetura de Namespace e Recursos Duplicados
      run: |
        # 1. Corrige o Manifesto removendo a tag antiga package para evitar conflitos nativos
        sed -i 's/package="mgks.os.swv"//g' app/src/main/AndroidManifest.xml

        # 2. Deleta o arquivo ads.xml para evitar a duplicação de strings do AdMob com o seu strings.xml
        rm -f app/src/main/res/values/ads.xml || true

        # 3. AJUSTE UNIFICADO DE NAMESPACE (CORREÇÃO DO ERRO R): 
        # Mantém a estrutura de código original do motor Java viva, alterando apenas a saída do APK final
        sed -i 's/namespace "mgks.os.swv"/namespace "mgks.os.swv"/g' app/build.gradle
        sed -i 's/applicationId "mgks.os.swv"/applicationId "com.lorenzo.aventureiro"/g' app/build.gradle

    - name: Compilar APK Nativo (Limpeza de Cache e Build)
      run: ./gradlew clean assembleDebug

    - name: Disponibilizar APK do Lorenzo para Download
      uses: actions/upload-artifact@v4
      with:
        name: Lorenzo-SmartWebView-APK
        path: app/build/outputs/apk/debug/app-debug.apk
