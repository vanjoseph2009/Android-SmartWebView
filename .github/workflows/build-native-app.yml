name: Build Smart WebView v8 AAB Assinado VJGames

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código Nativo
      uses: actions/checkout@v4

    - name: Configurar ambiente Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Aceitar Licenças do Android SDK Pré-instalado
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Configurar Gradle Estável no Executor
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Correção de Arquitetura de Namespace, Pacotes e Mapeamento de Plugins
      run: |
        rm -f app/src/main/res/values/ads.xml || true
        python3 -c '
        import re
        c = chr(58)
        p = "app/src/main/AndroidManifest.xml"
        s = open(p).read()
        s = re.sub(r"xmlns:android=\"[^\"]*\"", f"xmlns{c}android=\"http{c}//://android.com\"", s)
        s = re.sub(r"xmlns:tools=\"[^\"]*\"", f"xmlns{c}tools=\"http{c}//://android.com\"", s)
        open(p, "w").write(s)
        '

    - name: Restaurar Chave Keystore Definitiva
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > oficial.keystore

    - name: Compilar App Bundle Nativo usando Gradle 8.4
      run: |
        CI=false gradle clean :app:bundleRelease --console=plain --no-daemon --no-configuration-cache

    - name: Assinar AAB de Forma Fixa e Segura
      run: |
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore oficial.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" app/build/outputs/bundle/release/app-release.aab "${{ secrets.ANDROID_KEYSTORE_ALIAS }}"
        mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/Lorenzo_O_Aventureiro_Assinado.aab

    - name: Disponibilizar AAB do Lorenzo para Download
      uses: actions/upload-artifact@v4
      with:
        name: Lorenzo-VJGames-AAB-Final
        path: app/build/outputs/bundle/release/Lorenzo_O_Aventureiro_Assinado.aab
