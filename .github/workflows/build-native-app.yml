name: Build Smart WebView v8 APK Assinado VJGames

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código Nativo
      uses: actions/checkout@v4.2.2

    - name: Configurar ambiente Java JDK 17
      uses: actions/setup-java@v4.5.0
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Android SDK e Aceitar Licenças
      uses: android-actions/setup-android@v3.2.1

    - name: Garantir Permissões do Compilador
      run: |
        chmod +x gradlew
        mkdir -p "$ANDROID_HOME/licenses" || true
        echo "24a335a4f57f80877430e4ae15220d914f646721" > "$ANDROID_HOME/licenses/android-sdk-license" || true

    - name: Correção de Arquitetura de Namespace e Recursos Duplicados
      run: |
        # 1. Limpa o manifesto de tags de pacotes antigas para evitar conflitos nativos de compilação
        sed -i 's/package=".*"//g' app/src/main/AndroidManifest.xml || true

        # 2. Elimina o ficheiro ads.xml para evitar a duplicação de strings do AdMob com o seu strings.xml
        rm -f app/src/main/res/values/ads.xml || true

        # 3. RESOLUÇÃO COMPATÍVEL COM SMART WEBVIEW V8:
        # Injeta diretamente as propriedades corretas no build.gradle independentemente da formatação original
        sed -i 's/namespace .*/namespace "com.vjgames.lorenzooaventureiro"/g' app/build.gradle || true
        sed -i 's/applicationId .*/applicationId "com.vjgames.lorenzooaventureiro"/g' app/build.gradle || true

    - name: Compilar APK Nativo (assembleRelease)
      run: ./gradlew clean assembleRelease

    - name: Gerar Keystore Temporária, Alinhar e Assinar APK Oficialmente
      run: |
        # 1. Cria uma chave de segurança digital válida em tempo de execução
        keytool -genkey -v -keystore temporaria.keystore -alias lorenzoalias -keyalg RSA -keysize 2048 -validity 10000 -storepass lorenzopass -keypass lorenzopass -dname "CN=VJ Games, OU=Development, O=VJ Games, L=Sao Paulo, S=SP, C=BR"
        
        # 2. Localiza as ferramentas de Build do Android SDK para usar o zipalign e apksigner
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
        
        # 3. Alinha o APK para otimização de memória (obrigatório antes de assinar com apksigner)
        $BUILD_TOOLS_DIR/zipalign -v 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-lorenzo-alinhado.apk

        # 4. Assina o APK utilizando o apksigner oficial (Gera assinaturas V1, V2 e V3 compatíveis com todas as versões do Android)
        $BUILD_TOOLS_DIR/apksigner sign --ks temporaria.keystore --ks-pass pass:lorenzopass --key-pass pass:lorenzopass --out app/build/outputs/apk/release/Lorenzo_O_Aventureiro_Assinado.apk app/build/outputs/apk/release/app-lorenzo-alinhado.apk

    - name: Disponibilizar APK Assinado para Download
      uses: actions/upload-artifact@v4.4.3
      with:
        name: Lorenzo-VJGames-APK-Final
        path: app/build/outputs/apk/release/Lorenzo_O_Aventureiro_Assinado.apk
