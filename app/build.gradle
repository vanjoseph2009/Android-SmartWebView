plugins {
	id 'com.android.application'
}

android {
	// IMPORTANTE: Não use o sinal de igual (=) aqui. O script .yml do seu GitHub 
	// usa uma expressão regular que espera a sintaxe sem igual. Mantendo este formato,
	// o comando 'sed' fará a colagem perfeita e manterá o Groovy válido.
	namespace 'mgks.os.swv'
	compileSdk 34

	defaultConfig {
		applicationId 'mgks.os.swv'
		minSdk 24
		targetSdk 34
		versionCode 10
		versionName "9.0.2"
		multiDexEnabled true
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
	}

	buildFeatures {
		buildConfig true
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}
}

dependencies {
	testImplementation 'junit:junit:4.13.2'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

	implementation fileTree(include: ['*.jar'], dir: 'libs')
	implementation 'androidx.multidex:multidex:2.0.1'

	// Google Play Services Básicos Estabilizados
	implementation 'com.google.android.gms:play-services-auth:21.2.0'
	implementation 'com.google.android.gms:play-services-location:21.3.0'

	// AndroidX Jetpack Core
	implementation 'com.google.android.material:material:1.12.0'
	implementation 'androidx.core:core-splashscreen:1.0.1'
	implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
	implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
	implementation 'androidx.appcompat:appcompat:1.7.0'
	implementation 'androidx.browser:browser:1.8.0'
	implementation 'androidx.work:work-runtime:2.9.0'

	// Plugins Nativos Isolados do Smart WebView
	implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
	implementation 'androidx.biometric:biometric:1.1.0'
}
