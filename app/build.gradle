plugins {
	id 'com.android.application'
}

android {
	namespace "com.lorenzo.aventureiro"
	compileSdk 35 // Ajustado para estabilidade máxima com as bibliotecas Google Play de 2026

	defaultConfig {
		applicationId "com.lorenzo.aventureiro"
		minSdk 24
		targetSdk 35
		versionCode 10
		versionName "9.0.2"
		multiDexEnabled true
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
	}

	buildFeatures {
		buildConfig true
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}
}

dependencies {
	testImplementation 'junit:junit:4.13.2'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

	implementation fileTree(include: ['*.jar'], dir: 'libs')
	implementation 'androidx.multidex:multidex:2.0.1'

	// Gerenciador Oficial do Firebase (BoM) - Alinha todas as versões de segurança sem quebras
	implementation platform('com.google.firebase:firebase-bom:33.10.0')
	implementation 'com.google.firebase:firebase-auth'
	implementation 'com.google.firebase:firebase-config'
	implementation 'com.google.firebase:firebase-messaging'
	implementation 'com.google.firebase:firebase-analytics'

	// Google Play Services Estabilizados
	implementation 'com.google.android.gms:play-services-auth:21.2.0'
	implementation 'com.google.android.gms:play-services-ads:23.6.0' // Versão LTS recomendada para compilação Gradle estável
	implementation 'com.google.android.gms:play-services-location:21.3.0'

	// AndroidX Jetpack Core
	implementation 'com.google.android.material:material:1.12.0'
	implementation 'androidx.core:core-splashscreen:1.0.1'
	implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
	implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
	implementation 'androidx.appcompat:appcompat:1.7.0'
	implementation 'androidx.browser:browser:1.8.0'
	implementation 'androidx.work:work-runtime:2.9.1'

	// Plugins Nativos Integrados
	implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
	implementation 'androidx.biometric:biometric:1.1.0'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    println "swv-fcm-sync: google-services.json nao encontrado. Pulando configuracao Firebase."
}
