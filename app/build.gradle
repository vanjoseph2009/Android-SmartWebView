/*
  Smart WebView v8 - Versão de Produção Estabilizada para VJGames
  https://github.com
*/

plugins {
	id 'com.android.application'
}

android {
	namespace = 'mgks.os.swv'
	compileSdk = 34

	defaultConfig {
		applicationId = 'com.vjgames.lorenzooaventureiro'
		minSdk = 24
		targetSdk = 34
		versionCode = 10
		versionName = "9.0.2"
		multiDexEnabled true
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}
}

dependencies {
	// ... (outras dependências padrão)

	// ALINHAMENTO OFICIAL DE VERSÕES DO FIREBASE (Evita erros de desugaring)
	implementation platform('com.google.firebase:firebase-bom:33.1.1')
	implementation 'com.google.firebase:firebase-auth'
	implementation 'com.google.firebase:firebase-analytics'

	// Google Play Services & Anúncios em Versão LTS Harmônica
	implementation 'com.google.android.gms:play-services-ads:23.1.0'
	
	// ... (dependências de interface e outros plugins)
}
