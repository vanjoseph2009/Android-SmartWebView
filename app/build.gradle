plugins {
	id 'com.android.application'
}

android {
	namespace = 'mgks.os.swv'
	compileSdk = 34

	defaultConfig {
		applicationId = 'com.vjgames.lorenzooaventureiro'
		minSdk = 24
		targetSdk = 34
		versionCode = 10
		versionName = "9.0.2"
		multiDexEnabled true
	}

	buildTypes {
		release {
			minifyEnabled = false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
	}

	buildFeatures {
		buildConfig true
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}
}

dependencies {
	testImplementation 'junit:junit:4.13.2'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

	implementation fileTree(include: ['*.jar'], dir: 'libs')
	implementation 'androidx.multidex:multidex:2.0.1'

	// Dependências oficiais restauradas para compatibilidade cirúrgica com o motor v8
	implementation 'com.google.firebase:firebase-auth:24.1.0'
	implementation 'com.google.firebase:firebase-config:23.1.0'
	implementation 'com.google.firebase:firebase-messaging:25.1.0'
	implementation 'com.google.firebase:firebase-analytics:23.2.0'

	implementation 'com.google.android.gms:play-services-auth:21.6.0'
	implementation 'com.google.android.gms:play-services-ads:24.9.0'
	implementation 'com.google.android.gms:play-services-location:21.3.0'

	// AndroidX Jetpack Core
	implementation 'com.google.android.material:material:1.12.0'
	implementation 'androidx.core:core-splashscreen:1.2.0'
	implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
	implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'androidx.browser:browser:1.10.0'
	implementation 'androidx.work:work-runtime:2.11.2'

	// Plugins Nativos
	implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
	implementation 'androidx.biometric:biometric:1.1.0'
}
