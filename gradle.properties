# ===================================================================
#   Smart WebView v8 - Configurações Fixas de Produção (VJGames)
# ===================================================================

# Configuração Pura de Memória e Compiladores sem caracteres de escape
org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvm.options=-Xmx2048M

# Suporte ao Ecossistema AndroidX
android.useAndroidX=true
android.debug.obsoleteApi=true

# Mapeamento Estável de Recursos para o Motor V8
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# Modo de Exibição de Avisos
org.gradle.warning.mode=all

# Desativação Absoluta do Cache de Configuração
org.gradle.unsafe.configuration-cache=false
